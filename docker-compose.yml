services:

  # ── CPU ──────────────────────────────────────────────────────────────────
  qwen3-asr:
    profiles: [cpu]
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen3-asr-rust-cpu
    volumes:
      - ./audio:/audio

  # ── CUDA / NVIDIA GPU ────────────────────────────────────────────────────
  qwen3-asr-cuda:
    profiles: [cuda]
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: qwen3-asr-rust-cuda
    volumes:
      - ./audio:/audio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# ─── Quick reference ─────────────────────────────────────────────────────────
#
#  Build & run CPU:
#    docker compose --profile cpu up -d --build
#    docker compose --profile cpu run --rm qwen3-asr /audio/your_file.wav
#
#  Build & run CUDA:
#    docker compose --profile cuda up -d --build
#    docker compose --profile cuda run --rm qwen3-asr-cuda /audio/your_file.wav
#
# ─────────────────────────────────────────────────────────────────────────────
